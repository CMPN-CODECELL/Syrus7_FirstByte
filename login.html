<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — CampusOS</title>
    <meta name="description" content="Sign in to your CampusOS student account." />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="login" class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col justify-between antialiased">
    
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
      <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
          <div class="inline-flex w-10 h-10 rounded-xl bg-blue-600 text-white font-bold text-lg items-center justify-center mb-3 shadow-sm">
            C
          </div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
            Welcome back to CampusOS
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Sign in with your campus credentials or use a quick demo profile
          </p>
        </div>

        <!-- Hackathon One-Click Demo Logins -->
        <div class="mb-6 p-3.5 bg-blue-50/60 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900/60 rounded-xl">
          <span class="block text-[11px] font-bold uppercase tracking-wider text-blue-700 dark:text-blue-300 mb-2">
            🚀 Quick Hackathon Demo Accounts
          </span>
          <div class="grid grid-cols-2 gap-2">
            <button id="quick-demo-aarav" type="button" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-800 text-slate-800 dark:text-slate-200 hover:border-blue-500 transition-colors shadow-2xs text-left truncate">
              👤 Aarav Sharma <span class="text-[10px] text-slate-400 block font-normal">CS 2nd Year</span>
            </button>
            <button id="quick-demo-ananya" type="button" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-800 text-slate-800 dark:text-slate-200 hover:border-blue-500 transition-colors shadow-2xs text-left truncate">
              👤 Ananya Patel <span class="text-[10px] text-slate-400 block font-normal">Design 3rd Year</span>
            </button>
          </div>
        </div>

        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
          <span class="bg-white dark:bg-slate-900 px-3 text-[11px] uppercase font-semibold text-slate-400 absolute">or email</span>
        </div>

        <!-- Form Error Box -->
        <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-xs text-rose-700 dark:text-rose-300"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
          <div>
            <label for="login-email" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Campus Email</label>
            <input id="login-email" type="email" placeholder="aarav.sharma@campus.edu" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" value="aarav.sharma@campus.edu" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="login-password" class="block text-xs font-bold text-slate-700 dark:text-slate-300">Password</label>
              <a href="#" onclick="alert('For demo evaluation, any password will sign in!'); return false;" class="text-[11px] text-blue-600 dark:text-blue-400 hover:underline">Forgot?</a>
            </div>
            <input id="login-password" type="password" placeholder="••••••••" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" value="password123" />
          </div>

          <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm transition-colors mt-2">
            Sign In to CampusOS
          </button>
        </form>

        <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
          Don't have an account yet? 
          <a href="signup.html" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Create Student Account</a>
        </p>

      </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script type="module">
      import './js/app.js';
      import { AuthService } from './js/services/auth.js';
      import { UI } from './js/utils/ui.js';

      const form = document.getElementById('login-form');
      const errBox = document.getElementById('login-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = AuthService.login(email, password);
        if (res.success) {
          UI.showToast(`Welcome back, ${res.user.name}!`, 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
        } else {
          errBox.textContent = res.message;
          errBox.classList.remove('hidden');
        }
      });

      document.getElementById('quick-demo-aarav').addEventListener('click', () => {
        AuthService.loginAsDemo('student-1');
        UI.showToast('Logged in as Aarav Sharma!', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 250);
      });

      document.getElementById('quick-demo-ananya').addEventListener('click', () => {
        AuthService.loginAsDemo('student-2');
        UI.showToast('Logged in as Ananya Patel!', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 250);
      });
    </script>
  </body>
</html>
