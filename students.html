<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Connect — Student Discovery | CampusOS</title>
    <meta name="description" content="Discover, search, and connect with fellow college students by branch, year, skills, and interests." />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="students" class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

    <!-- Top Navigation -->
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      
      <!-- Page Header -->
      <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">Student Directory</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight mt-1">
            Campus Connect
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xl">
            Find peer study partners, project teammates, and mentors across branches and graduation years.
          </p>
        </div>
        <div id="students-count-badge" class="text-xs font-semibold text-slate-500 dark:text-slate-400 tabular-nums">
          Loading students...
        </div>
      </div>

      <!-- Filters Toolbar -->
      <div class="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 mb-8 shadow-2xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
          
          <!-- Search Input -->
          <div class="lg:col-span-2">
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">Search Students</label>
            <div class="relative">
              <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input id="student-search" type="text" placeholder="Search by name, interests..." class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500" />
            </div>
          </div>

          <!-- Branch Filter -->
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">Branch</label>
            <select id="student-branch-filter" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
              <option value="all">All Branches</option>
              <option value="Computer">Computer Engineering</option>
              <option value="Data Science">Data Science & AI</option>
              <option value="Electronics">Electronics & Comm</option>
              <option value="Information Tech">Information Tech</option>
              <option value="Mechanical">Mechanical Engineering</option>
              <option value="Design">Design Tech</option>
              <option value="Biotechnology">Biotechnology</option>
            </select>
          </div>

          <!-- Year Filter -->
          <div>
            <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400 mb-1">Year</label>
            <select id="student-year-filter" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
              <option value="all">All Years</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>

          <!-- Skill Filter & Reset -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-400">Skill Keyword</label>
              <button id="student-filters-reset" class="text-[10px] text-blue-600 dark:text-blue-400 hover:underline">Reset</button>
            </div>
            <input id="student-skill-filter" type="text" placeholder="e.g. Python, Figma" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500" />
          </div>

        </div>
      </div>

      <!-- Students Grid -->
      <div id="students-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Injected via js/students.js -->
      </div>

      <!-- Empty State -->
      <div id="students-empty-state" class="hidden text-center py-20 p-8 border border-slate-200 dark:border-slate-800 rounded-2xl bg-white dark:bg-slate-900">
        <svg class="w-12 h-12 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <h3 class="text-sm font-bold text-slate-900 dark:text-white">No matching students found</h3>
        <p class="text-xs text-slate-400 mt-1">Try resetting the filters or searching for another keyword.</p>
      </div>

      <!-- Student Profile Modal -->
      <div id="student-modal" class="hidden fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 md:p-20 modal-backdrop bg-slate-900/60 flex justify-center items-start">
        <div id="student-modal-content" class="relative w-full max-w-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden animate-slide-down">
          <!-- Dynamically populated -->
        </div>
      </div>

    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script type="module">
      import './js/app.js';
      import { initStudentsPage } from './js/students.js';
      initStudentsPage();
    </script>
  </body>
</html>
