<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — CampusOS</title>
    <meta name="description" content="Join CampusOS to connect with peers, exchange skills, and share academic resources." />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="signup" class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col justify-between antialiased">
    
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
      <div class="w-full max-w-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
        
        <div class="text-center mb-6">
          <div class="inline-flex w-10 h-10 rounded-xl bg-blue-600 text-white font-bold text-lg items-center justify-center mb-3 shadow-sm">
            C
          </div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
            Join the CampusOS Network
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Build your peer network, trade materials, and unlock campus opportunities.
          </p>
        </div>

        <div id="signup-error" class="hidden mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-xs text-rose-700 dark:text-rose-300"></div>

        <form id="signup-form" class="space-y-4">
          <div>
            <label for="signup-name" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Full Student Name *</label>
            <input id="signup-name" type="text" placeholder="e.g., Rohan Verma" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div>
            <label for="signup-email" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">College Email Address *</label>
            <input id="signup-email" type="email" placeholder="e.g., rohan.v@campus.edu" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div>
            <label for="signup-college" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">College / Institute *</label>
            <input id="signup-college" type="text" value="Campus Institute of Technology" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="signup-branch" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Course / Branch *</label>
              <select id="signup-branch" required class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Data Science & AI">Data Science & AI</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Design & Interaction Tech">Design & Interaction Tech</option>
                <option value="Biotechnology">Biotechnology</option>
              </select>
            </div>

            <div>
              <label for="signup-year" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Academic Year *</label>
              <select id="signup-year" required class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year" selected>2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
          </div>

          <div>
            <label for="signup-skills" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Key Skills (comma separated)</label>
            <input id="signup-skills" type="text" placeholder="e.g. Python, Figma, React, C++, Arduino" class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" value="Python, Problem Solving" />
          </div>

          <div>
            <label for="signup-password" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password *</label>
            <input id="signup-password" type="password" placeholder="At least 6 characters" minlength="6" required class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" value="campuspass" />
          </div>

          <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm transition-colors mt-4">
            Complete Registration & Enter
          </button>
        </form>

        <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
          Already registered? 
          <a href="login.html" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Sign In here</a>
        </p>

      </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script type="module">
      import './js/app.js';
      import { AuthService } from './js/services/auth.js';
      import { UI } from './js/utils/ui.js';

      const form = document.getElementById('signup-form');
      const errBox = document.getElementById('signup-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const college = document.getElementById('signup-college').value;
        const branch = document.getElementById('signup-branch').value;
        const year = document.getElementById('signup-year').value;
        const skillsRaw = document.getElementById('signup-skills').value;
        const password = document.getElementById('signup-password').value;

        const skills = skillsRaw.split(',').map(s => s.trim()).filter(Boolean);

        const res = AuthService.signup({
          name,
          email,
          college,
          branch,
          year,
          password,
          skills,
          interests: ["Peer Learning", "Campus Innovation"]
        });

        if (res.success) {
          UI.showToast(`Welcome to CampusOS, ${res.user.name}!`, 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
        } else {
          errBox.textContent = res.message;
          errBox.classList.remove('hidden');
        }
      });
    </script>
  </body>
</html>
